name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - zip: project.zip
            name: DnsChanger
          - zip: vira.zip
            name: Vira
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Check zip
        id: chk
        run: |
          if [ -f "${{ matrix.zip }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.zip }} not found, skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack zip
        if: steps.chk.outputs.ok == 'true'
        run: |
          rm -rf _p && mkdir _p
          unzip -q "${{ matrix.zip }}" -d _p
          SET=$(find _p -name settings.gradle.kts | head -1)
          if [ -z "$SET" ]; then echo "settings.gradle.kts not found inside zip"; find _p | head -50; exit 1; fi
          echo "PROJ=$(dirname "$SET")" >> "$GITHUB_ENV"

      - name: Set up Java
        if: steps.chk.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: steps.chk.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare signing key
        if: steps.chk.outputs.ok == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "BUILD_TYPE=release" >> "$GITHUB_ENV"
            echo "Signing key found: building a signed release APK"
          else
            echo "BUILD_TYPE=debug" >> "$GITHUB_ENV"
            echo "No signing key set: building a debug APK"
          fi

      - name: Build APK
        if: steps.chk.outputs.ok == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle -p "$PROJ" assembleRelease --no-daemon --stacktrace
          else
            gradle -p "$PROJ" assembleDebug --no-daemon --stacktrace
          fi

      - name: Collect APK
        if: steps.chk.outputs.ok == 'true'
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/$BUILD_TYPE/*.apk out/${{ matrix.name }}.apk

      - name: Upload APK
        if: steps.chk.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-apk
          path: out/${{ matrix.name }}.apk
